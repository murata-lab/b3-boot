<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#233649;background:#fff;font:15px/1.7 ui-sans-serif,system-ui,-apple-system,sans-serif}button{font:inherit}button{border:1px solid #b9cbdc;background:white;color:#233649;border-radius:8px;padding:7px 12px;cursor:pointer}button:hover:not(:disabled){background:#edf5ff}button:disabled{opacity:.4;cursor:default}button:focus-visible{outline:3px solid #3484d0;outline-offset:3px}.player{border:1px solid #dbe4ed;border-radius:14px;padding:18px;background:#fff}.top{display:flex;gap:12px;justify-content:space-between;align-items:center}.top h2{font-size:17px;margin:0}.status{font-size:13px;white-space:nowrap;color:#52687c}.controls{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:12px 0}.controls button[data-action=play]{background:#2563a6;color:white;min-width:115px}.progress{font-variant-numeric:tabular-nums;margin-left:auto;font-size:13px;color:#52687c}.narrative{min-height:188px;margin-top:18px}.stage{display:inline-block;font-size:12px;font-weight:700;color:#2563a6;background:#edf5ff;border-radius:5px;padding:2px 8px}.narrative h3{font-size:20px;line-height:1.5;margin:6px 0}.equation{font-size:17px;font-weight:600;line-height:1.65;overflow-x:auto;padding:9px 12px;background:#f5f8fc;border-radius:8px;min-height:48px}.explanation{margin:8px 0;font-size:14px;min-height:48px}.figure{height:385px;overflow:auto;border:1px solid #e4eaf1;border-radius:10px;padding:5px;background:white}.figure>svg{display:block;width:100%;height:360px;min-width:600px;font-family:ui-sans-serif,system-ui,sans-serif}.comparison-scroll{overflow-x:auto}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-width:1000px}.comparison section{min-width:0;border:1px solid #dbe4ed;border-radius:8px;padding:7px}.comparison section:last-child{border-color:#82b6ab}.comparison h3{font-size:15px;margin:0 5px 4px}.comparison svg{display:block;width:100%;height:auto}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;font-size:11px;color:#52687c;border-top:1px solid #e4eaf1;padding-top:6px}.metrics b{display:block;min-height:26px;color:#233649;font-size:15px}.detail{height:155px;overflow:auto;margin-top:10px}.detail:empty{height:155px}.nn-table{overflow:auto}table{border-collapse:collapse;font-size:12px;width:100%;font-variant-numeric:tabular-nums}td,th{padding:7px 10px;border-bottom:1px solid #dbe4ed;text-align:left;white-space:nowrap}th{background:#f5f8fc}.contribution{padding:12px;background:#fff4eb;border-left:4px solid #b45a16;font-weight:600}.hint{margin:8px 0 0;font-size:12px;color:#65758a}.static{display:none}noscript .static{display:block}@media(max-width:620px){.player{padding:10px}.narrative{min-height:220px}.top{align-items:flex-start}.top h2{font-size:16px}.equation{font-size:15px}.figure{height:385px}.explanation{min-height:64px}}
</style></head>
<body>
<main class="player" data-index="0" data-state="paused" aria-label="__TITLE__">
<div class="top"><h2>__TITLE__</h2><span class="status" role="status">停止中</span></div>
<div class="controls">
<button type="button" data-action="prev" aria-label="戻る">← 戻る</button>
<button type="button" data-action="next" aria-label="進む">進む →</button>
<button type="button" data-action="play" aria-label="自動ループ再生" aria-pressed="false">▶ 自動ループ再生</button>
<span class="progress" aria-label="現在のコマ"></span>
</div>
<div class="narrative"><span class="stage"></span><h3 id="step-title"></h3><div class="equation"></div><p class="explanation"></p></div>
<div class="figure" aria-label="現在の計算グラフ">__INITIAL__</div>
<div class="detail"></div>
<p class="hint">自動再生は最後まで進むと先頭に戻ります。同じボタンでもう一度押すと停止します。</p>
<noscript>自動再生にはJavaScriptが必要です。上の初期図と本文の式・計算結果から流れを読めます。</noscript>
</main>
<script>
(() => {
'use strict';
const frames=__FRAMES__;
const root=document.querySelector('.player');
const $=selector=>root.querySelector(selector);
const play=$('[data-action=play]');
let index=0, playing=false, timer=null, generation=0;
const id=crypto.randomUUID ? crypto.randomUUID() : String(Math.random());
// The channel name is unique to this notebook execution; different tasks do not interfere.
const bus=typeof BroadcastChannel==='function' ? new BroadcastChannel(__CHANNEL__) : null;
function announce(){if(bus)bus.postMessage({type:'pause-others',id});}
function cancelTimer(){generation++;if(timer!==null)clearTimeout(timer);timer=null;}
function stop(){cancelTimer();playing=false;syncControls();}
function syncControls(){
 root.dataset.index=String(index);root.dataset.state=playing?'playing':'paused';
 play.textContent=playing?'Ⅱ ループ再生を停止':'▶ 自動ループ再生';
 play.setAttribute('aria-label',playing?'ループ再生を停止':'自動ループ再生');play.setAttribute('aria-pressed',String(playing));
 $('.status').textContent=playing?'ループ再生中':'停止中';
 $('[data-action=prev]').disabled=index===0;
 $('[data-action=next]').disabled=index===frames.length-1;
 $('.progress').textContent=`${index+1} / ${frames.length}`;
}
function render(){
 const frame=frames[index];
 $('.stage').textContent=frame.stage;$('#step-title').textContent=frame.title;
 $('.equation').textContent=frame.equation;$('.explanation').textContent=frame.explanation;
 // Preserve horizontal comparison position while replacing the immutable frame.
 const oldScroll=$('.comparison-scroll'); const position=oldScroll?oldScroll.scrollLeft:0;
 $('.figure').innerHTML=frame.figure;$('.detail').innerHTML=frame.detail;
 const newScroll=$('.comparison-scroll');if(newScroll)newScroll.scrollLeft=position;
 syncControls();
}
function schedule(){
 cancelTimer();const token=generation;
 timer=setTimeout(()=>{
  if(!playing||token!==generation||document.hidden)return;
  index=(index+1)%frames.length;
  render();if(playing)schedule();
 },index===frames.length-1?2000:1000);
}
function seek(position){stop();announce();index=Math.max(0,Math.min(position,frames.length-1));render();}
root.addEventListener('click',event=>{
 const button=event.target.closest('button[data-action]');if(!button)return;
 switch(button.dataset.action){
  case 'prev':seek(index-1);break;
  case 'next':seek(index+1);break;
  case 'play':
   if(playing){stop();return;}
   announce();
   playing=true;render();schedule();break;
 }
});
root.addEventListener('keydown',event=>{
 if(event.key==='ArrowRight'){event.preventDefault();seek(index+1);}
 if(event.key==='ArrowLeft'){event.preventDefault();seek(index-1);}
});
if(bus)bus.onmessage=event=>{if(event.data?.type==='pause-others'&&event.data.id!==id)stop();};
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
if(typeof IntersectionObserver==='function')new IntersectionObserver(entries=>{if(!entries[0].isIntersecting)stop();},{threshold:0}).observe(root);
window.addEventListener('pagehide',()=>{stop();if(bus)bus.close();});
render();
})();
</script></body></html>
